<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unser Familienplaner</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #ffffff;
    padding: 20px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

h1 {
    margin: 0;
    font-size: 32px;
}

.date {
    margin-top: 8px;
    font-size: 20px;
}

.family {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
    padding: 20px;
}

.person {
    background: white;
    border-radius: 16px;
    padding: 18px;
    min-height: 250px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.person h2 {
    margin-top: 0;
    font-size: 24px;
}

.task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 5px;
    border-bottom: 1px solid #eee;
    font-size: 18px;
}

.task input {
    width: 24px;
    height: 24px;
}

.add {
    margin: 20px;
    padding: 16px;
    font-size: 20px;
    border: none;
    border-radius: 12px;
    background: #333;
    color: white;
}
</style>
</head>

<body>

<header>
    <h1>🏠 Unser Familienplaner</h1>
    <div class="date">Heute</div>
</header>

<main class="family">

    <section class="person">
        <h2>👩 Mama</h2>
        <div class="task">
            <input type="checkbox">
            Einkauf erledigen
        </div>
        <div class="task">
            <input type="checkbox">
            Wäsche aufhängen
        </div>
    </section>

    <section class="person">
        <h2>👨 Papa</h2>
        <div class="task">
            <input type="checkbox">
            Müll rausbringen
        </div>
        <div class="task">
            <input type="checkbox">
            Auto tanken
        </div>
    </section>

    <section class="person">
        <h2>👧 Ava</h2>
        <div class="task">
            <input type="checkbox">
            Schulranzen packen
        </div>
        <div class="task">
            <input type="checkbox">
            Zähne putzen
        </div>
    </section>

    <section class="person">
        <h2>👦 Noah</h2>
        <div class="task">
            <input type="checkbox">
            Sporttasche packen
        </div>
        <div class="task">
            <input type="checkbox">
            Zimmer aufräumen
        </div>
    </section>

    <section class="person">
        <h2>👧 Luise</h2>
        <div class="task">
            <input type="checkbox">
            Spielzeug aufräumen
        </div>
        <div class="task">
            <input type="checkbox">
            Zähne putzen
        </div>
    </section>

</main>

<button class="add">＋ Aufgabe hinzufügen</button>

</body>
</html>
