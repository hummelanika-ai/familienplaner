<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unser Familienplaner</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f3f4f6;
    color: #222;
}

header {
    background: #ffffff;
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

h1 {
    margin: 0;
    font-size: 28px;
}

#date {
    margin-top: 8px;
    color: #666;
}

.family {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card h2 {
    text-align: center;
    margin-top: 5px;
}

.task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 5px;
    border-bottom: 1px solid #eee;
    font-size: 17px;
}

.task input {
    width: 22px;
    height: 22px;
}

.task input:checked + span {
    text-decoration: line-through;
    color: #999;
}

@media (max-width: 1000px) {
    .family {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .family {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>🏠 Unser Familienplaner</h1>
    <div id="date"></div>
</header>

<div class="family">

    <div class="card">
        <h2>👩 Mama</h2>

        <label class="task">
            <input type="checkbox" data-task="mama1">
            <span>Wäsche machen</span>
        </label>

        <label class="task">
            <input type="checkbox" data-task="mama2">
            <span>Einkaufen</span>
        </label>
    </div>

    <div class="card">
        <h2>👨 Papa</h2>

        <label class="task">
            <input type="checkbox" data-task="papa1">
            <span>Auto tanken</span>
        </label>

        <label class="task">
            <input type="checkbox" data-task="papa2">
            <span>Müll rausbringen</span>
        </label>
    </div>

    <div class="card">
        <h2>👧 Ava</h2>

        <label class="task">
            <input type="checkbox" data-task="ava1">
            <span>Zimmer aufräumen</span>
        </label>

        <label class="task">
            <input type="checkbox" data-task="ava2">
            <span>Zähne putzen</span>
        </label>
    </div>

    <div class="card">
        <h2>👦 Noah</h2>

        <label class="task">
            <input type="checkbox" data-task="noah1">
            <span>Schultasche packen</span>
        </label>

        <label class="task">
            <input type="checkbox" data-task="noah2">
            <span>Zimmer aufräumen</span>
        </label>
    </div>

    <div class="card">
        <h2>👧 Luise</h2>

        <label class="task">
            <input type="checkbox" data-task="luise1">
            <span>Spielzeug aufräumen</span>
        </label>

        <label class="task">
            <input type="checkbox" data-task="luise2">
            <span>Zähne putzen</span>
        </label>
    </div>

</div>

<script>

// Datum anzeigen
const today = new Date();

document.getElementById("date").textContent =
    today.toLocaleDateString("de-DE", {
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric"
    });


// Aufgaben laden
document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {

    const task = checkbox.dataset.task;

    const saved = localStorage.getItem("task_" + task);

    if (saved === "true") {
        checkbox.checked = true;
    }

    checkbox.addEventListener("change", () => {

        localStorage.setItem(
            "task_" + task,
            checkbox.checked
        );

    });

});

</script>

</body>
</html>
